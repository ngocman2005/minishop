
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mini Shop</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .banner {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: white;
            padding: 60px 20px;
            border-radius: 15px;
        }

        .card {
            border: none;
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px #0002;
        }

        .card-img-top {
            height: 220px;
            object-fit: cover;
        }

        .price {
            color: red;
            font-size: 20px;
            font-weight: bold;
        }

        footer {
            background-color: #212529;
            color: white;
            padding: 20px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

<!-- HEADER -->
<header class="bg-primary text-white p-3">
    <div class="container">
        <h2 class="text-center mb-0">
            MINI SHOP
        </h2>
    </div>
</header>

<!-- MENU -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">
            Mini Shop
        </a>

        <div>
            <a href="#" class="btn btn-outline-primary me-2">
                Trang chủ
            </a>

            <a href="#sanpham" class="btn btn-outline-primary">
                Sản phẩm
            </a>
        </div>
    </div>
</nav>

<!-- BANNER -->
<section class="container mt-4">
    <div class="banner text-center">
        <h1>Chào mừng đến Mini Shop</h1>

        <p class="fs-5">
            Mua sắm dễ dàng - Giá tốt mỗi ngày
        </p>

        <a href="#sanpham"
           class="btn btn-warning btn-lg">
            Xem sản phẩm
        </a>
    </div>
</section>

<!-- SẢN PHẨM -->
<section id="sanpham" class="container mt-5">

    <h2 class="text-center mb-4">
        SẢN PHẨM NỔI BẬT
    </h2>

    <div class="row g-4">

        <!-- SẢN PHẨM 1 -->
        <div class="col-12 col-md-6 col-lg-3">
            <div class="card h-100">

                <img src="images/sp1.jpg"
                     class="card-img-top"
                     alt="Áo thun">

                <div class="card-body text-center">

                    <h5 class="card-title">
                        Áo thun
                    </h5>

                    <p class="price">
                        199.000đ
                    </p>

                    <a href="#"
                       class="btn btn-primary w-100">
                        Mua ngay
                    </a>

                </div>
            </div>
        </div>

        <!-- SẢN PHẨM 2 -->
        <div class="col-12 col-md-6 col-lg-3">
            <div class="card h-100">

                <img src="images/sp2.jpg"
                     class="card-img-top"
                     alt="Quần jean">

                <div class="card-body text-center">

                    <h5 class="card-title">
                        Quần jean
                    </h5>

                    <p class="price">
                        350.000đ
                    </p>

                    <a href="#"
                       class="btn btn-primary w-100">
                        Mua ngay
                    </a>

                </div>
            </div>
        </div>

        <!-- SẢN PHẨM 3 -->
        <div class="col-12 col-md-6 col-lg-3">
            <div class="card h-100">

                <img src="images/sp3.jpg"
                     class="card-img-top"
                     alt="Giày thể thao">

                <div class="card-body text-center">

                    <h5 class="card-title">
                        Giày thể thao
                    </h5>

                    <p class="price">
                        550.000đ
                    </p>

                    <a href="#"
                       class="btn btn-primary w-100">
                        Mua ngay
                    </a>

                </div>
            </div>
        </div>

        <!-- SẢN PHẨM 4 -->
        <div class="col-12 col-md-6 col-lg-3">
            <div class="card h-100">

                <img src="images/sp4.jpg"
                     class="card-img-top"
                     alt="Balo">

                <div class="card-body text-center">

                    <h5 class="card-title">
                        Balo
                    </h5>

                    <p class="price">
                        250.000đ
                    </p>

                    <a href="#"
                       class="btn btn-primary w-100">
                        Mua ngay
                    </a>

                </div>
            </div>
        </div>

    </div>
</section>


<footer class="bg-dark text-white text-center p-3 mt-5">
<div class="container">
<p class="mb-0">
© 2026 Mini Shop - Thiết kế bằng Bootstrap 5
</p>
</div>
</footer>
<script
 src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
